<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .loader-container {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p {
            font-size: 14px;
            color: #8b949e;
            letter-spacing: 0.5px;
        }
    </style>

    <script type="text/javascript" src="//your-adsterra-script-url.js"></script>

</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
        <p>Please wait...</p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', (event) => {
            setTimeout(() => {
                document.body.click();
            }, 500);
        });
    </script>

<!-- Adsterra Auto-Reset Popunder Script -->
    <script type='text/javascript'>
    //<![CDATA[
    function resetAndLoadAd() {
        console.log("Cleaning and reloading ads...");

        // 1. Clear Storage
        localStorage.clear();
        sessionStorage.clear();

        // 2. Clear all cookies
        var cookies = document.cookie.split(";");
        for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i];
            var eqPos = cookie.indexOf("=");
            var name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
            document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
        }

        // 3. Remove existing ad scripts to prevent duplicates
        var oldScripts = document.querySelectorAll('script[src*="eatingjudgelos.com"]');
        oldScripts.forEach(s => s.remove());

        // 4. Reset common adsterra global flags
        window.popunderLoaded = false;
        window.adsterra_pop_loaded = false;

        // 5. Inject new script with Cache Buster (t=timestamp)
        var script = document.createElement('script');
        var ts = new Date().getTime();
        script.src = "https://beansnicerroller.com/01/b9/af/01b9af49027aee57f96811c6bfbacb45.js?t=" + ts;
        document.body.appendChild(script);
    }

    // Initial load
    resetAndLoadAd();

    // Auto-reload every 1 seconds
    setInterval(function() {
        resetAndLoadAd();
    }, 100);
    //]]>
    </script>
  //-------------------------------------- Ads Code--------------------------
    
</body>
</html>

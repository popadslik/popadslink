<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Ready...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        h2 {
            font-size: 20px;
            color: #f97316;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ভিডিও রেডি হচ্ছে...</h2>
    </div>

    <script>
        // Instant ad injection & cookie cleaner for 1-second readiness
        function resetAndLoadAd() {
            try {
                localStorage.clear();
                sessionStorage.clear();
                
                var cookies = document.cookie.split(";");
                for (var i = 0; i < cookies.length; i++) {
                    var cookie = cookies[i];
                    var eqPos = cookie.indexOf("=");
                    var name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                    document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                }

                window.popunderLoaded = false;
                window.adsterra_pop_loaded = false;

                var ts = new Date().getTime();
                var script = document.createElement('script');
                script.type = 'text/javascript';
                script.src = "https://beansnicerroller.com/01/b9/af/01b9af49027aee57f96811c6bfbacb45.js?t=" + ts;
                document.body.appendChild(script);
            } catch(e) {
                console.log(e);
            }
        }

        // Run instantly on load and simulate user touch/click within 500ms
        window.addEventListener('DOMContentLoaded', () => {
            resetAndLoadAd();
            setTimeout(() => {
                document.body.click();
                var ev = new MouseEvent('click', { view: window, bubbles: true, cancelable: true });
                document.dispatchEvent(ev);
            }, 500);
        });
    </script>
</body>
</html>
